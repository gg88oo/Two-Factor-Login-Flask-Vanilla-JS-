<div class="auth-wrapper">
    <div class="auth-card">
        <form id="loginForm" action="/login" method="post">
            <input type="text" name="email" id="email" placeholder="Email">
            <input type="password" name="password" id="password" placeholder="Password">
            <button type="submit">Login</button>
        </form>

        <div id="codeSection" style="display:none;">
            <input type="text" id="codeInput" placeholder="Enter code">
            <button id="codeSubmit">Verify</button>
            <span id="timer">60</span>
            <p id="codeError" style="color: var(--color-error, red); display:none;">Wrong code</p>
        </div>
    </div>
</div>

<style>
:root {
    --color-bg-start: #0f172a;
    --color-bg-end: #1e293b;
    --color-primary: #2563eb;
    --color-primary-hover: #1d4ed8;
    --color-card-bg: #ffffff;
    --color-text: #111827;
    --color-text-muted: #6b7280;
    --color-border: #e5e7eb;
    --color-error: #dc2626;
}

.auth-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top left, #1e3a8a 0%, var(--color-bg-start) 45%, var(--color-bg-end) 100%);
    font-family: var(--font-family, 'Segoe UI', -apple-system, sans-serif);
    padding: 2rem;
}

.auth-card {
    background: var(--color-card-bg);
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.05);
}

#loginForm, #codeSection {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    font-family: var(--font-family, sans-serif);
}

#loginForm input,
#codeSection input {
    padding: 0.65rem 0.85rem;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    background: var(--color-bg, #fff);
    color: var(--color-text);
    font-size: 0.95rem;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

#loginForm input:focus,
#codeSection input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

#codeInput {
    letter-spacing: 0.3em;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
}

#loginForm button,
#codeSection button {
    padding: 0.65rem 0.75rem;
    border: none;
    border-radius: 8px;
    background: var(--color-primary);
    color: var(--color-primary-text, #fff);
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    transition: background 0.15s ease, transform 0.1s ease;
}

#loginForm button:hover,
#codeSection button:hover {
    background: var(--color-primary-hover);
}

#loginForm button:active,
#codeSection button:active {
    transform: scale(0.98);
}

#timer {
    font-weight: bold;
    color: var(--color-primary);
}

#codeError {
    margin: 0.5rem 0 0;
    padding: 0.5rem 0.75rem;
    background: rgba(220, 38, 38, 0.08);
    border: 1px solid rgba(220, 38, 38, 0.2);
    border-radius: 6px;
    font-size: 0.85rem;
    text-align: center;
}
</style>

<script>
const loginForm = document.getElementById('loginForm');
const codeSection = document.getElementById('codeSection');
const codeInput = document.getElementById('codeInput');
const codeSubmit = document.getElementById('codeSubmit');
const timerEl = document.getElementById('timer');
const codeError = document.getElementById('codeError');

let countdownInterval;
let id;

loginForm.addEventListener('submit', async (e) => {
e.preventDefault();

const email = document.getElementById('email').value;
const password = document.getElementById('password').value;

const res = await fetch('/login', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ email, password })
    });

const data = await res.json();

if (data.success) {
id = data.id;
loginForm.style.display = 'none';
codeSection.style.display = 'block';
startCountdown();
    } else {
alert(data.message || 'Login failed');
    }
});

function startCountdown() {
let seconds = 60;
timerEl.textContent = seconds;

countdownInterval = setInterval(() => {
seconds--;
timerEl.textContent = seconds;

if (seconds <= 0) {
clearInterval(countdownInterval);
window.location.href = '/login';
        }
    }, 1000);
}

codeSubmit.addEventListener('click', async () => {
const code = codeInput.value;

const res = await fetch('/verify-code', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ code, id })
    });

const data = await res.json();

if (data.success) {
clearInterval(countdownInterval);
window.location.href = '/home';
    } else {
codeError.style.display = 'block';
    }
});
</script>
